<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Prototipo · Mis vencimientos</title>
<style>
  :root{
    --bg:#f6f4ef; --surface:#fff; --ink:#1c2622; --muted:#5e6964; --line:#e3ded3;
    --brand:#1f6f5c; --brand-soft:#e2efe9; --red:#c0452a; --red-soft:#fbe3db;
    --amber:#9a6410; --amber-soft:#fdf0d8; --green-soft:#e2efe9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:#d9d4c8;font:400 16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);display:flex;justify-content:center}
  .phone{width:100%;max-width:420px;height:100dvh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
  @media(min-width:500px){.phone{height:860px;margin:20px 0;border-radius:32px;box-shadow:0 20px 60px rgba(0,0,0,.25)}}
  header.bar{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;background:var(--bg)}
  header.bar h1{font-size:21px;margin:0;flex:1;font-weight:650}
  .iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--ink)}
  .iconbtn:active{background:#0001}
  main{flex:1;overflow-y:auto;padding:0 16px 110px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
  .chip{flex:none;border:1px solid #cfc8bb;background:var(--surface);border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;min-height:40px}
  .chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
  .sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 2px 8px}
  .sec.red{color:var(--red)}
  .card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
  .card:active{background:#f1efe9}
  .card.over{border-color:#efc2b4;background:#fff8f5}
  .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:#eef2ef;flex:none}
  .t{font-weight:600;font-size:15.5px}
  .d{font-size:13px;color:var(--muted)}
  .pill{margin-left:auto;font-size:12.5px;font-weight:650;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .p-red{background:var(--red-soft);color:var(--red)} .p-amber{background:var(--amber-soft);color:var(--amber)} .p-green{background:var(--green-soft);color:var(--brand)}
  .fab{position:absolute;right:18px;bottom:86px;height:60px;padding:0 22px;border-radius:18px;border:0;background:var(--brand);color:#fff;font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 8px 20px rgba(31,111,92,.35);cursor:pointer}
  nav.bottom{position:absolute;left:0;right:0;bottom:0;height:72px;background:#fff;border-top:1px solid var(--line);display:flex}
  nav.bottom button{flex:1;border:0;background:none;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
  nav.bottom button span{font-size:22px}
  nav.bottom button.on{color:var(--brand);font-weight:650}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:14px;border:0;background:var(--brand);color:#fff;font:600 16px system-ui,sans-serif;cursor:pointer;margin-top:10px}
  .btn.sec2{background:var(--surface);color:var(--brand);border:1.5px solid var(--brand)}
  .btn.danger{background:var(--red)}
  .btn.ghost{background:none;color:var(--brand)}
  .field{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
  .field label{display:block;font-size:12.5px;color:var(--muted)}
  .field input,.field select{width:100%;border:0;font:500 16px system-ui,sans-serif;background:none;padding:4px 0;color:var(--ink);outline:none}
  .auto{font-size:11.5px;color:var(--brand);font-weight:650}
  .banner{border-radius:14px;padding:12px 14px;margin:6px 0 12px;font-size:14.5px}
  .banner.info{background:var(--brand-soft);color:#174f42}
  .banner.warn{background:var(--amber-soft);color:#6d4709}
  .doc{border-radius:14px;background:#fff;border:1px solid var(--line);padding:14px;position:relative;overflow:hidden;margin-bottom:12px}
  .doc .hd{font-size:11px;font-weight:700;letter-spacing:.06em;color:#3b5a52}
  .doc .big{font-size:18px;font-weight:700;margin:6px 0}
  .doc .row{display:flex;justify-content:space-between;font-size:13px;margin-top:4px}
  .mask{background:#1c2622;color:#1c2622;border-radius:4px;padding:0 4px}
  .camera{position:absolute;inset:0;background:#111;color:#fff;display:flex;flex-direction:column;z-index:20}
  .camera .view{flex:1;display:grid;place-items:center;padding:24px}
  .camera .frame{width:100%;aspect-ratio:1.55;border:2px dashed #fff8;border-radius:16px;display:grid;place-items:center;text-align:center;padding:16px;color:#fffc}
  .camera .samples{display:grid;gap:8px;padding:0 16px 10px}
  .camera .samples button{background:#ffffff1a;color:#fff;border:1px solid #fff3;border-radius:12px;padding:12px;font-size:15px;text-align:left;cursor:pointer}
  .shutter{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#fff3;margin:10px auto 26px;cursor:pointer}
  .scan{position:absolute;inset:0;background:#000c;display:grid;place-items:center;z-index:30;color:#fff;text-align:center;font-size:17px}
  .spinner{width:46px;height:46px;border:4px solid #fff4;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sheet-bg{position:absolute;inset:0;background:#0006;z-index:40;display:flex;align-items:flex-end}
  .sheet{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:20px 16px 24px;max-height:85%;overflow:auto}
  .sheet h2{margin:0 0 8px;font-size:19px}
  .snack{position:absolute;left:12px;right:12px;bottom:84px;background:#26302c;color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:50;font-size:14.5px}
  .snack button{margin-left:auto;background:none;border:0;color:#9fe0c9;font-weight:700;font-size:14.5px;cursor:pointer;min-height:40px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
  .cal .h{font-size:12px;color:var(--muted);padding:4px 0}
  .cal .c{min-height:44px;border-radius:10px;font-size:14px;padding-top:6px;position:relative;cursor:pointer;border:0;background:none;font-family:inherit}
  .cal .c.today{outline:2px solid var(--brand)}
  .cal .c .dot{display:block;width:7px;height:7px;border-radius:50%;margin:3px auto 0}
  .toggle{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
  .daychips{display:flex;gap:8px;flex-wrap:wrap}
  .src{font-size:12px;color:var(--muted);margin:2px 2px 12px}
  .hint{background:#fffbe6;border-bottom:1px solid #e9d68a;color:#5b4a00;font-size:12px;padding:4px 10px;text-align:center}
  :focus-visible{outline:3px solid #e8a33d;outline-offset:2px}
</style>
</head>
<body>
<div class="phone" id="app"></div>
<script>
// ---------- Datos de ejemplo ----------
const HOY = new Date(2026,10,7);
const fmt = d => d.toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'});
const dias = d => Math.round((d-HOY)/864e5);
let S = {
  tab:'inicio', filtro:'Todos', screen:null, snack:null, sheet:null, camera:false, scanning:false,
  elementos:[
    {id:'toyota', nombre:'Toyota Yaris', det:'Patente ABCD-12', ic:'🚗', cat:'Auto', activo:true},
    {id:'casa', nombre:'Casa Ñuñoa', det:'Rol 1234-56', ic:'🏠', cat:'Hogar', activo:true},
  ],
  venc:[
    {id:1, con:'Carnet de identidad', ic:'🪪', cat:'Personas', per:'Sofía', el:null, fecha:new Date(2026,9,20), avisos:[30,7,1], estado:'activo'},
    {id:2, con:'Revisión técnica', ic:'🔧', cat:'Auto', per:'Yo', el:'toyota', fecha:new Date(2026,10,13), avisos:[30,7,1], estado:'activo'},
    {id:3, con:'Licencia de conducir', ic:'🚘', cat:'Personas', per:'Yo', el:null, fecha:new Date(2026,11,2), avisos:[30,7,1], estado:'activo'},
    {id:4, con:'SOAP', ic:'🛡️', cat:'Auto', per:'Yo', el:'toyota', fecha:new Date(2027,2,31), avisos:[30,7,1], estado:'activo'},
    {id:5, con:'Permiso de circulación', ic:'📄', cat:'Auto', per:'Yo', el:'toyota', fecha:new Date(2027,2,31), avisos:[30,7,1], estado:'activo'},
    {id:6, con:'Garantía lavadora', ic:'🧺', cat:'Compras', per:'Yo', el:'casa', fecha:new Date(2027,2,12), avisos:[30,7], estado:'activo', nota:'Garantía legal 6 meses'},
    {id:7, con:'Contribuciones (cuota 4)', ic:'🏛️', cat:'Hogar', per:'Yo', el:'casa', fecha:new Date(2026,10,30), avisos:[7,1], estado:'activo'},
    {id:8, con:'Pasaporte', ic:'🛂', cat:'Personas', per:'Yo', el:null, fecha:new Date(2026,10,1), avisos:[30,7,1], estado:'activo'},
  ],
  pref:[30,7,1], nextId:9
};
let undoFn=null, snackTimer=null;
function set(p){if(p.sheet){S.snack=null;undoFn=null;}Object.assign(S,p);render();}
function snack(msg,undo){undoFn=undo||null;S.snack=msg;render();clearTimeout(snackTimer);snackTimer=setTimeout(()=>{S.snack=null;undoFn=null;render();},6000);}
function urg(v){const n=dias(v.fecha); if(n<0) return ['p-red',`vencido hace ${-n} d`]; if(n<=14) return ['p-red',`en ${n} días`]; if(n<=45) return ['p-amber',`en ${n} días`]; return ['p-green',fmt(v.fecha)];}
function elName(id){const e=S.elementos.find(x=>x.id===id);return e?e.nombre:'';}
function activos(){return S.venc.filter(v=>v.estado==='activo').filter(v=>S.filtro==='Todos'||v.cat===S.filtro||v.per===S.filtro).sort((a,b)=>a.fecha-b.fecha);}
function card(v){const [c,l]=urg(v);const sub=[v.per!=='Yo'?v.per:null,v.el?elName(v.el):null,v.nota].filter(Boolean).join(' · ')||'Yo';
  return `<button class="card ${dias(v.fecha)<0?'over':''}" onclick="openV(${v.id})"><span class="ic">${v.ic}</span><span><div class="t">${v.con}</div><div class="d">${sub}</div></span><span class="pill ${c}">${l}</span></button>`;}

// ---------- Pantallas ----------
function inicio(){
  const list=activos(); const venc=list.filter(v=>dias(v.fecha)<0); const prox=list.filter(v=>dias(v.fecha)>=0);
  const f=['Todos','Auto','Hogar','Personas','Compras','Sofía'];
  return `<header class="bar"><h1>Mis vencimientos</h1><button class="iconbtn" aria-label="Buscar">🔍</button></header>
  <main><div class="chips">${f.map(x=>`<button class="chip ${S.filtro===x?'on':''}" onclick="set({filtro:'${x}'})">${x}</button>`).join('')}</div>
  ${venc.length?`<div class="sec red">Vencidos sin renovar · ${venc.length}</div>${venc.map(card).join('')}`:''}
  <div class="sec">Próximos</div>${prox.map(card).join('')||'<p class="d">Nada pendiente con este filtro.</p>'}
  </main><button class="fab" onclick="set({sheet:'agregar'})" aria-label="Agregar">＋ Agregar</button>`;
}
function calendario(){
  const y=2026,m=10; const first=(new Date(y,m,1).getDay()+6)%7; const n=30; let cells='';
  for(let i=0;i<first;i++) cells+='<div></div>';
  for(let d=1;d<=n;d++){const vs=S.venc.filter(v=>v.estado==='activo'&&v.fecha.getFullYear()===y&&v.fecha.getMonth()===m&&v.fecha.getDate()===d);
    const col=vs.length?(new Date(y,m,d)<HOY?'var(--red)':'var(--amber)'):'transparent';
    cells+=`<button class="c ${d===7?'today':''}" onclick="${vs.length?`openV(${vs[0].id})`:''}">${d}<span class="dot" style="background:${col}"></span></button>`;}
  const mes=S.venc.filter(v=>v.estado==='activo'&&v.fecha.getMonth()===m&&v.fecha.getFullYear()===y).sort((a,b)=>a.fecha-b.fecha);
  return `<header class="bar"><button class="iconbtn" aria-label="Mes anterior">‹</button><h1 style="text-align:center">Noviembre 2026</h1><button class="iconbtn" aria-label="Mes siguiente">›</button></header>
  <main><div class="cal">${['L','M','M','J','V','S','D'].map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div>
  <div class="sec">Este mes</div>${mes.map(card).join('')}</main>`;
}
function elementos(){
  return `<header class="bar"><h1>Mis cosas</h1></header><main>
  <div class="sec">Elementos</div>${S.elementos.filter(e=>e.activo).map(e=>{const k=S.venc.filter(v=>v.el===e.id&&v.estado==='activo').length;
    return `<button class="card" onclick="set({screen:{t:'el',id:'${e.id}'}})"><span class="ic">${e.ic}</span><span><div class="t">${e.nombre}</div><div class="d">${e.det} · ${k} documentos</div></span><span class="pill p-green">›</span></button>`;}).join('')}
  <div class="sec">Personas</div>
  <button class="card"><span class="ic">🙂</span><span><div class="t">Yo</div><div class="d">Chile</div></span></button>
  <button class="card"><span class="ic">👧</span><span><div class="t">Sofía</div><div class="d">Hija · Chile</div></span></button>
  <button class="card"><span class="ic">👴</span><span><div class="t">Papá</div><div class="d">Argentina · modo genérico</div></span></button>
  ${S.elementos.some(e=>!e.activo)?`<div class="sec">Dados de baja</div>${S.elementos.filter(e=>!e.activo).map(e=>`<button class="card" onclick="reactivar('${e.id}')"><span class="ic" style="opacity:.5">${e.ic}</span><span><div class="t">${e.nombre}</div><div class="d">Toca para reactivar</div></span></button>`).join('')}`:''}
  </main>`;
}
function ajustes(){
  return `<header class="bar"><h1>Ajustes</h1></header><main>
  <div class="sec">Avisos por defecto</div>
  <div class="field"><label>Avisarme antes de cada vencimiento</label><div class="daychips" style="margin-top:6px">${[60,30,15,7,1].map(d=>`<button class="chip ${S.pref.includes(d)?'on':''}" onclick="togPref(${d})">${d} ${d===1?'día':'días'}</button>`).join('')}</div></div>
  <div class="field"><label>Hora del aviso</label><select><option>09:00</option><option>12:00</option><option>20:00</option></select></div>
  <div class="sec">Por tipo de documento</div>
  ${['SOAP','Revisión técnica','Licencia de conducir','Garantía'].map(c=>`<button class="card" onclick="set({sheet:{t:'concepto',c:'${c}'}})"><span><div class="t">${c}</div><div class="d">${c==='SOAP'&&S.soap?S.soap.join(', ')+' días · personalizado':'Usa los avisos por defecto'}</div></span><span class="pill p-green">›</span></button>`).join('')}
  <div class="sec">Privacidad y datos</div>
  <div class="toggle"><span>Ocultar datos sensibles en fotos</span><span>✅</span></div>
  <div class="toggle"><span>Bloqueo con huella</span><span>✅</span></div>
  <div class="toggle"><span>Estadísticas anónimas</span><span>⬜</span></div>
  <button class="card"><span><div class="t">Exportar respaldo cifrado</div><div class="d">Último: nunca</div></span></button>
  <div class="sec">General</div>
  <div class="toggle"><span>País</span><span>Chile</span></div><div class="toggle"><span>Idioma</span><span>Español (Chile)</span></div>
  <button class="card"><span><div class="t">Reportar un problema o sugerir una mejora</div></span></button>
  </main>`;
}
function detalle(id){
  const v=S.venc.find(x=>x.id===id); const [c,l]=urg(v); const av=v.con==='SOAP'&&S.soap?S.soap:v.avisos;
  return `<header class="bar"><button class="iconbtn" onclick="set({screen:null})" aria-label="Volver">←</button><h1>${v.con}</h1></header><main>
  <div class="doc"><div class="hd">${v.ic} ${v.cat.toUpperCase()}${v.el?' · '+elName(v.el).toUpperCase():''}</div><div class="big">${v.con}</div>
   <div class="row"><span>Titular</span><span>${v.per==='Yo'?'Juan Pérez':v.per+' Pérez'}</span></div>
   <div class="row"><span>RUN</span><span class="mask">12.345.678-9</span></div>
   <div class="row"><span>Vence</span><b>${fmt(v.fecha)}</b></div>
   <div class="d" style="margin-top:8px">🔒 Datos sensibles ocultos automáticamente</div></div>
  <span class="pill ${c}" style="display:inline-block">${l}</span>
  <div class="sec">Avisos</div><div class="field"><label>${v.con==='SOAP'&&S.soap?'Personalizado para SOAP':'Heredado de los avisos por defecto'}</label><div>${av.map(d=>d+(d===1?' día':' días')).join(' · ')} antes, a las 09:00</div></div>
  <div class="sec">Historial</div><div class="field"><label>Periodo anterior</label><div>Vigente hasta ${fmt(new Date(v.fecha.getFullYear()-1,v.fecha.getMonth(),v.fecha.getDate()))} · con foto</div></div>
  <button class="btn" onclick="renovar(${v.id})">📷 Renovar con una foto</button>
  ${dias(v.fecha)<0?`<button class="btn sec2" onclick="posponer(${v.id})">Recordármelo en 7 días</button>`:''}
  <button class="btn ghost" onclick="archivar(${v.id})">Archivar: ya no aplica</button>
  </main>`;
}
function elemento(id){
  const e=S.elementos.find(x=>x.id===id); const vs=S.venc.filter(v=>v.el===id&&v.estado==='activo').sort((a,b)=>a.fecha-b.fecha);
  return `<header class="bar"><button class="iconbtn" onclick="set({screen:null})" aria-label="Volver">←</button><h1>${e.nombre}</h1></header><main>
  <p class="d" style="margin:0 2px 10px">${e.det} · ${e.cat}</p>
  ${e.cat==='Auto'?`<button class="btn" onclick="set({screen:{t:'control',id:'${id}'}})">👮 Mostrar documentos (control)</button>`:''}
  <div class="sec">Documentos</div>${vs.map(card).join('')}
  <button class="btn ghost" onclick="set({sheet:{t:'baja',id:'${id}'}})" style="color:var(--red)">Dar de baja (vendido / ya no lo tengo)</button></main>`;
}
function control(id){
  const e=S.elementos.find(x=>x.id===id); const vs=S.venc.filter(v=>v.el===id&&v.estado==='activo');
  return `<header class="bar"><button class="iconbtn" onclick="set({screen:{t:'el',id:'${id}'}})" aria-label="Volver">←</button><h1>Documentos del auto</h1></header><main>
  <div class="banner info">Funciona sin conexión. Desliza para ver cada documento.</div>
  ${vs.concat([{con:'Licencia de conducir',ic:'🚘',fecha:new Date(2026,11,2),cat:'Personas',hd:'CONDUCTOR · YO'}]).map(v=>`<div class="doc"><div class="hd">${v.ic} ${v.hd||e.nombre.toUpperCase()+' · '+e.det.toUpperCase()}</div><div class="big">${v.con}</div><div class="row"><span>Vigente hasta</span><b>${fmt(v.fecha)}</b></div><div class="row"><span>Estado</span><span>${dias(v.fecha)<0?'❌ Vencido':'✅ Vigente'}</span></div></div>`).join('')}
  </main>`;
}
function revision(){
  const r=S.screen.r;
  return `<header class="bar"><button class="iconbtn" onclick="set({screen:null})" aria-label="Cancelar">✕</button><h1>Revisa y guarda</h1></header><main>
  ${r.renov?`<div class="banner info">🔄 Es una <b>renovación</b> de “${r.con}” de ${r.el?elName(r.el):r.per}. Guardaremos la foto anterior en el historial.</div>`:`<div class="banner info">✨ Documento nuevo reconocido.</div>`}
  <div class="doc"><div class="hd">📸 FOTO GUARDADA</div><div class="big">${r.con}</div><div class="row"><span>${r.el?'Patente':'RUN'}</span><span class="mask">${r.el?'ABCD-12':'12.345.678-9'}</span></div><div class="d" style="margin-top:6px">🔒 Ocultamos automáticamente los datos sensibles</div></div>
  <div class="field"><label>Documento <span class="auto">· detectado</span></label><select><option>${r.con}</option><option>SOAP</option><option>Permiso de circulación</option></select></div>
  <div class="field"><label>Vence <span class="auto">· leído de la foto</span></label><input value="${fmt(r.fecha)}"></div>
  <div class="field"><label>${r.el?'Elemento':'Persona'} <span class="auto">· detectado</span></label><select><option>${r.el?elName(r.el):r.per}</option></select></div>
  <div class="field"><label>Avisos</label><div>${S.pref.join(', ')} días antes</div></div>
  <button class="btn" onclick="guardar()">Guardar</button></main>`;
}
function manual(){
  return `<header class="bar"><button class="iconbtn" onclick="set({screen:null})" aria-label="Cancelar">✕</button><h1>Agregar a mano</h1></header><main>
  <div class="field"><label>¿Qué es?</label><select id="mcon"><option>Cumpleaños</option><option>Seguro hogar</option><option>Garantía</option><option>Otro…</option></select></div>
  <div class="field"><label>Nombre</label><input id="mnom" placeholder="Ej. Cumpleaños de Mila"></div>
  <div class="field"><label>Fecha</label><input id="mfec" type="date" value="2026-11-09"></div>
  <div class="field"><label>Repetir</label><select><option>Cada año</option><option>No repetir</option></select></div>
  <button class="btn" onclick="guardarManual()">Guardar</button></main>`;
}

// ---------- Hojas y cámara ----------
function sheet(){
  const sh=S.sheet; if(!sh) return '';
  if(sh==='agregar') return `<div class="sheet-bg" onclick="if(event.target===this)set({sheet:null})"><div class="sheet"><h2>Agregar</h2>
    <button class="btn" onclick="set({sheet:null,camera:true})">📷 Sacar foto del documento o boleta</button>
    <button class="btn sec2" onclick="set({sheet:null,screen:{t:'manual'}})">✍️ Escribirlo a mano</button></div></div>`;
  if(sh.t==='concepto'){const cur=S.soap||S.pref; return `<div class="sheet-bg" onclick="if(event.target===this)set({sheet:null})"><div class="sheet"><h2>Avisos para ${sh.c}</h2>
    <p class="src">${sh.c==='SOAP'&&S.soap?'Personalizado':'Ahora usa los avisos por defecto'}</p>
    <div class="daychips">${[60,30,15,7,1].map(d=>`<button class="chip ${cur.includes(d)?'on':''}" onclick="togSoap(${d})">${d} ${d===1?'día':'días'}</button>`).join('')}</div>
    <button class="btn" onclick="set({sheet:null});snack('Avisos de ${sh.c} guardados')">Guardar</button>
    <button class="btn ghost" onclick="S.soap=null;set({sheet:null})">Restablecer valores por defecto</button></div></div>`;}
  if(sh.t==='baja'){const e=S.elementos.find(x=>x.id===sh.id); const vs=S.venc.filter(v=>v.el===sh.id&&v.estado==='activo');
    return `<div class="sheet-bg" onclick="if(event.target===this)set({sheet:null})"><div class="sheet"><h2>¿Dar de baja ${e.nombre}?</h2>
    <p class="d">Se archivarán estos documentos y dejarás de recibir sus avisos. Quedan en el historial y puedes reactivarlos.</p>
    ${vs.map(v=>`<label class="toggle"><span>${v.ic} ${v.con}</span><input type="checkbox" checked data-v="${v.id}" style="width:22px;height:22px"></label>`).join('')}
    <button class="btn danger" onclick="darBaja('${sh.id}')">Dar de baja</button><button class="btn ghost" onclick="set({sheet:null})">Cancelar</button></div></div>`;}
  return '';
}
function camera(){
  return `<div class="camera"><header class="bar" style="background:none"><button class="iconbtn" style="color:#fff" onclick="set({camera:false})" aria-label="Cerrar">✕</button><h1 style="color:#fff;font-size:17px">Encuadra el documento</h1></header>
  <div class="view"><div class="frame">Apunta al documento o boleta.<br><small>(En el prototipo, elige abajo qué documento “fotografías”)</small></div></div>
  <div class="samples">
   <button onclick="foto('rt')">🔧 Certificado de revisión técnica del Toyota</button>
   <button onclick="foto('carnet')">🪪 Carnet nuevo de Sofía</button>
   <button onclick="foto('boleta')">🧾 Boleta de un televisor</button></div>
  <div class="shutter" onclick="foto('rt')" role="button" aria-label="Sacar foto"></div></div>`;
}

// ---------- Acciones ----------
function openV(id){set({screen:{t:'v',id}});}
function foto(k){
  S.camera=false; S.scanning=true; render();
  setTimeout(()=>{
    let r;
    if(k==='rt') r={k,con:'Revisión técnica',el:'toyota',per:'Yo',fecha:new Date(2027,10,13),renov:2};
    if(k==='carnet') r={k,con:'Carnet de identidad',el:null,per:'Sofía',fecha:new Date(2032,9,20),renov:1};
    if(k==='boleta') r={k,con:'Garantía televisor',el:'casa',per:'Yo',fecha:new Date(2027,4,7),renov:null};
    set({scanning:false,screen:{t:'rev',r}});
  },1600);
}
function guardar(){
  const r=S.screen.r;
  if(r.renov){const v=S.venc.find(x=>x.id===r.renov); const old=v.fecha; v.fecha=r.fecha; set({screen:null,tab:'inicio'}); snack(`${v.con} renovado hasta ${fmt(r.fecha)}`,()=>{v.fecha=old;});}
  else {const v={id:S.nextId++,con:r.con,ic:'📺',cat:'Compras',per:'Yo',el:r.el,fecha:r.fecha,avisos:[30,7],estado:'activo',nota:'Garantía legal 6 meses'}; S.venc.push(v); set({screen:null,tab:'inicio'}); snack('Garantía guardada',()=>{v.estado='borrado';});}
}
function guardarManual(){
  const nom=document.getElementById('mnom').value||document.getElementById('mcon').value; const f=new Date(document.getElementById('mfec').value+'T12:00');
  const v={id:S.nextId++,con:nom,ic:'🎂',cat:'Personas',per:'Yo',el:null,fecha:isNaN(f)?new Date(2026,10,9):f,avisos:[7,1],estado:'activo',nota:'Cada año'}; S.venc.push(v); set({screen:null,tab:'inicio'}); snack('Recordatorio guardado',()=>{v.estado='borrado';});
}
function renovar(id){set({screen:null,camera:true});}
function posponer(id){const v=S.venc.find(x=>x.id===id); set({screen:null}); snack(`Te lo recordaremos el ${fmt(new Date(HOY.getTime()+7*864e5))}`);}
function archivar(id){const v=S.venc.find(x=>x.id===id); v.estado='archivado'; set({screen:null}); snack(`${v.con} archivado`,()=>{v.estado='activo';});}
function darBaja(id){
  const checks=[...document.querySelectorAll('[data-v]')]; const ids=checks.filter(c=>c.checked).map(c=>+c.dataset.v);
  const e=S.elementos.find(x=>x.id===id); e.activo=false; ids.forEach(i=>S.venc.find(v=>v.id===i).estado='archivado');
  set({sheet:null,screen:null,tab:'elementos'}); snack(`${e.nombre} dado de baja · ${ids.length} documentos archivados`,()=>{e.activo=true;ids.forEach(i=>S.venc.find(v=>v.id===i).estado='activo');});
}
function reactivar(id){const e=S.elementos.find(x=>x.id===id); e.activo=true; S.venc.filter(v=>v.el===id&&v.estado==='archivado').forEach(v=>v.estado='activo'); render(); snack(`${e.nombre} reactivado`);}
function togPref(d){S.pref=S.pref.includes(d)?S.pref.filter(x=>x!==d):[...S.pref,d].sort((a,b)=>b-a);render();}
function togSoap(d){const cur=S.soap||[...S.pref]; S.soap=cur.includes(d)?cur.filter(x=>x!==d):[...cur,d].sort((a,b)=>b-a);render();}
function doUndo(){if(undoFn)undoFn(); undoFn=null; S.snack=null; clearTimeout(snackTimer); render();}

// ---------- Render ----------
function render(){
  let body='';
  const sc=S.screen;
  if(sc&&sc.t==='v') body=detalle(sc.id);
  else if(sc&&sc.t==='el') body=elemento(sc.id);
  else if(sc&&sc.t==='control') body=control(sc.id);
  else if(sc&&sc.t==='rev') body=revision();
  else if(sc&&sc.t==='manual') body=manual();
  else body=({inicio,calendario,elementos,ajustes})[S.tab]();
  const tabs=[['inicio','🏠','Inicio'],['calendario','📅','Calendario'],['elementos','🚗','Mis cosas'],['ajustes','⚙️','Ajustes']];
  document.getElementById('app').innerHTML = `<div class="hint">Prototipo de prueba · datos de ejemplo</div>` + body +
    (sc?'':`<nav class="bottom">${tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="set({tab:'${t[0]}',screen:null})"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`) +
    sheet() + (S.camera?camera():'') + (S.scanning?`<div class="scan"><div><div class="spinner"></div>Reconociendo el documento…</div></div>`:'') +
    (S.snack?`<div class="snack" role="status">${S.snack}${undoFn?'<button onclick="doUndo()">Deshacer</button>':''}</div>`:'');
}
render();
</script>
</body>
</html>
